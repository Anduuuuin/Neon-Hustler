<!DOCTYPE html>
<html lang="de">
<head>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0418">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon192.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neon Hustler – Prototyp Startbildschirm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Oswald:wght@500;700&family=Permanent+Marker&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#12061f;color-scheme:light;color:#000;overflow:hidden;font-family:'Oswald',sans-serif;-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
  .screen{position:fixed;inset:0;overflow:hidden;display:none}
  .screen.on{display:block}
  .stage{position:absolute;left:50%;top:50%;aspect-ratio:944/1680;transform:translate(-50%,-50%)}
  .layer{position:absolute;inset:0;will-change:transform}
  .layer>img{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}

  /* ===== START ===== */
  #bg{inset:-4%}
  #bg>img{animation:zoom 30s ease-in-out infinite alternate}
  @keyframes zoom{from{transform:scale(1)}to{transform:scale(1.06)}}
  #sunglow{position:absolute;left:65%;top:20%;width:70%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
    background:radial-gradient(circle,rgba(255,210,90,.55) 0%,rgba(255,120,80,.25) 35%,rgba(255,60,140,0) 70%);mix-blend-mode:screen;animation:pulse 5s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.6;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}}
  #shimmer{position:absolute;left:0;top:32%;width:100%;height:12%;mix-blend-mode:screen;opacity:.75;
    background:repeating-linear-gradient(100deg,rgba(255,220,150,0) 0 18px,rgba(255,230,170,.55) 20px,rgba(255,220,150,0) 24px 46px);
    -webkit-mask-image:linear-gradient(180deg,transparent,#000 40%,#000 70%,transparent);mask-image:linear-gradient(180deg,transparent,#000 40%,#000 70%,transparent);animation:shim 3.5s linear infinite}
  @keyframes shim{from{background-position:0 0}to{background-position:92px 0}}
  #neon{position:absolute;left:91%;top:20.5%;width:6%;height:9.5%;transform:translate(-50%,0);border-radius:30%;
    background:radial-gradient(ellipse,rgba(255,80,200,.9),rgba(255,80,200,0) 70%);mix-blend-mode:screen;animation:flicker 4s steps(1) infinite}
  #neon2{position:absolute;left:96%;top:22%;width:7%;height:12%;border-radius:30%;
    background:radial-gradient(ellipse,rgba(60,240,255,.6),rgba(60,240,255,0) 70%);mix-blend-mode:screen;animation:flicker 6.3s steps(1) infinite reverse}
  @keyframes flicker{0%{opacity:1}7%{opacity:.2}9%{opacity:1}11%{opacity:.4}13%{opacity:1}61%{opacity:1}63%{opacity:.15}66%{opacity:.9}100%{opacity:1}}
  #wet{position:absolute;left:0;top:52%;width:100%;height:30%;mix-blend-mode:screen;opacity:.5;
    background:linear-gradient(115deg,transparent 30%,rgba(255,90,200,.45) 45%,transparent 60%);background-size:300% 100%;
    -webkit-mask-image:linear-gradient(180deg,transparent,#000 30%,#000 60%,transparent);mask-image:linear-gradient(180deg,transparent,#000 30%,#000 60%,transparent);animation:wet 9s ease-in-out infinite}
  @keyframes wet{0%,100%{background-position:100% 0}50%{background-position:0 0}}
  #carwrap{position:absolute;inset:0;pointer-events:none}
  #car{position:absolute;width:78%;left:-90%;top:58%;transform-origin:50% 100%;filter:drop-shadow(0 18px 10px rgba(20,0,40,.55))}
  #car img{position:static;width:100%;height:auto;display:block}
  #car .lights{position:absolute;right:-22%;top:52%;width:40%;height:22%;background:radial-gradient(ellipse at left,rgba(255,250,210,.85),rgba(255,250,210,0) 70%);mix-blend-mode:screen}
  #car .streak{position:absolute;left:-60%;top:30%;width:60%;height:50%;
    background:repeating-linear-gradient(180deg,rgba(255,255,255,0) 0 10px,rgba(255,200,240,.35) 11px,rgba(255,255,255,0) 13px 22px);
    -webkit-mask-image:linear-gradient(90deg,transparent,#000);mask-image:linear-gradient(90deg,transparent,#000)}
  #car.drive{animation:drive 4.6s cubic-bezier(.3,.1,.6,.95) forwards}
  @keyframes drive{0%{left:-90%;top:54%;transform:rotate(13deg) scale(.85)}100%{left:115%;top:70%;transform:rotate(13deg) scale(1.05)}}
  #car .body{animation:bounce .18s ease-in-out infinite alternate}
  @keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-1.2%)}}
  #figin{position:absolute;left:-6%;top:19%;width:90%;height:90%}
  #figin img{position:absolute;inset:0;width:100%;height:100%;transform-origin:35% 100%;animation:breathe 4.2s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1,1) rotate(0)}50%{transform:scale(1.006,1.014) rotate(-.4deg)}}
  #smoke,#dust{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(18,4,32,.75) 100%)}
  #startui{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;pointer-events:none}
  #logo{margin-top:max(6vh,24px);transform:rotate(-5deg);text-align:center;animation:logoin 1.1s cubic-bezier(.2,1.6,.4,1) both}
  @keyframes logoin{from{transform:rotate(-5deg) scale(2.2);opacity:0}to{transform:rotate(-5deg) scale(1);opacity:1}}
  #logo .t{font-family:'Bangers',cursive;font-size:clamp(48px,15vw,88px);line-height:.9;letter-spacing:3px;color:#ffe14d;
    -webkit-text-stroke:3px #000;paint-order:stroke fill;text-shadow:5px 5px 0 #ff3d8b,0 0 18px rgba(255,61,139,.9),0 0 40px rgba(255,61,139,.6);animation:logoflick 7s steps(1) infinite}
  #logo .t2{color:#2fe0ea;text-shadow:5px 5px 0 #8a2a8f,0 0 18px rgba(47,224,234,.9),0 0 40px rgba(47,224,234,.6);animation-delay:2.3s}
  @keyframes logoflick{0%{opacity:1}40%{opacity:1}41%{opacity:.35}42%{opacity:1}43%{opacity:.5}44%{opacity:1}100%{opacity:1}}
  #tap{position:absolute;bottom:max(9vh,40px);font-family:'Bangers',cursive;font-size:clamp(22px,6.5vw,34px);letter-spacing:2px;color:#fff;
    -webkit-text-stroke:1.5px #000;paint-order:stroke fill;text-shadow:3px 3px 0 #000;animation:blink 1.4s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.96)}}

  /* ===== ÜBERGANG ===== */
  #wipe{position:fixed;inset:-20%;z-index:50;pointer-events:none;transform:translateX(-140%) skewX(-18deg);
    background:repeating-linear-gradient(90deg,#000 0 46px,#ffe14d 46px 70px,#000 70px 116px,#ff3d8b 116px 132px)}
  #wipe.go{animation:wipe 1.1s cubic-bezier(.7,0,.3,1) forwards}
  @keyframes wipe{0%{transform:translateX(-140%) skewX(-18deg)}45%,55%{transform:translateX(0) skewX(-18deg)}100%{transform:translateX(140%) skewX(-18deg)}}

  /* ===== INTRO-COMIC ===== */
  #intro{background:#14081f;background-image:radial-gradient(rgba(255,255,255,.06) 1.2px,transparent 1.4px);background-size:9px 9px}
  #panelbox{position:absolute;left:50%;top:50%;width:min(94vw,640px);transform:translate(-50%,-50%)}
  .cap{position:relative;z-index:3;display:inline-block;background:#ffe14d;border:3px solid #000;padding:8px 12px;font-size:clamp(15px,4.3vw,20px);font-weight:500;line-height:1.3;
    box-shadow:4px 4px 0 #000;margin:0 0 -14px 10px;max-width:86%;transform:rotate(-1.5deg)}
  .frame{position:relative;border:5px solid #000;box-shadow:8px 8px 0 #ff3d8b;overflow:hidden;aspect-ratio:1456/1088;background:#000}
  .frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:kb 9s ease-out forwards}
  @keyframes kb{from{transform:scale(1.12)}to{transform:scale(1)}}
  .panel-in{animation:pin .55s cubic-bezier(.2,1.4,.4,1) both}
  @keyframes pin{from{opacity:0;transform:translateY(40px) rotate(3deg) scale(.9)}to{opacity:1;transform:none}}
  .bubble{position:absolute;z-index:4;background:#fff;border:3px solid #000;border-radius:22px;padding:8px 14px;font-family:'Permanent Marker',cursive;
    font-size:clamp(14px,4vw,19px);line-height:1.25;max-width:58%;box-shadow:3px 3px 0 #000;animation:pop .4s cubic-bezier(.2,1.8,.4,1) both}
  .bubble.phone{font-size:clamp(12px,3.4vw,16px);max-width:52%;border-radius:6px;background:#2fe0ea;font-family:'Oswald',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
  @keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
  .sfx{position:absolute;z-index:4;font-family:'Bangers',cursive;font-size:clamp(46px,14vw,84px);color:#ffe14d;-webkit-text-stroke:3px #000;paint-order:stroke fill;
    text-shadow:5px 5px 0 #ff3d8b;transform:rotate(-12deg);animation:sfx .25s ease-in-out infinite alternate}
  @keyframes sfx{from{transform:rotate(-12deg) scale(1)}to{transform:rotate(-8deg) scale(1.08)}}
  .shake .frame{animation:shake .12s linear infinite}
  @keyframes shake{0%{transform:translate(0,0)}25%{transform:translate(-3px,2px)}50%{transform:translate(3px,-2px)}75%{transform:translate(-2px,-3px)}100%{transform:translate(0,0)}}
  #next{position:absolute;right:16px;bottom:max(22px,env(safe-area-inset-bottom));font-family:'Bangers',cursive;font-size:24px;letter-spacing:1px;color:#fff;
    -webkit-text-stroke:1px #000;paint-order:stroke fill;text-shadow:2px 2px 0 #000;animation:blink 1.4s ease-in-out infinite;pointer-events:none}
  #skip{position:absolute;left:14px;top:max(14px,env(safe-area-inset-top));background:rgba(0,0,0,.45);color:#fff;border:2px solid rgba(255,255,255,.4);
    font-family:'Oswald',sans-serif;font-size:14px;padding:6px 12px;cursor:pointer}
  #dots{position:absolute;left:0;right:0;bottom:max(30px,env(safe-area-inset-bottom));display:flex;justify-content:center;gap:8px;pointer-events:none}
  #dots span{width:10px;height:10px;border:2px solid #000;background:#555;transform:rotate(45deg)}
  #dots span.on{background:#ffe14d}

  /* ===== VERSTECK ===== */
  #hide{background:#0d0618}
  #hide .bulb{position:absolute;left:55%;top:8.5%;width:46%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
    background:radial-gradient(circle,rgba(255,200,110,.55),rgba(255,160,60,.15) 40%,rgba(255,160,60,0) 70%);mix-blend-mode:screen;animation:bulb 6s steps(1) infinite}
  @keyframes bulb{0%{opacity:1}52%{opacity:1}53%{opacity:.4}54%{opacity:1}56%{opacity:.6}57%{opacity:1}100%{opacity:1}}
  #hide .win{position:absolute;left:4%;top:7%;width:20%;height:17%;background:radial-gradient(ellipse,rgba(255,60,200,.45),rgba(255,60,200,0) 70%);mix-blend-mode:screen;animation:pulse2 4s ease-in-out infinite}
  @keyframes pulse2{0%,100%{opacity:.5}50%{opacity:1}}
  #hide .tv{position:absolute;left:13.6%;top:38%;width:13%;height:8%;border-radius:12%;
    background:repeating-linear-gradient(180deg,rgba(255,255,255,.12) 0 2px,rgba(0,0,0,0) 2px 4px);mix-blend-mode:screen;animation:tv .15s steps(2) infinite}
  @keyframes tv{0%{opacity:.5;background-position:0 0}100%{opacity:.9;background-position:0 3px}}
  #hide .tvglow{position:absolute;left:5%;top:32%;width:32%;height:22%;background:radial-gradient(ellipse,rgba(80,220,255,.3),rgba(80,220,255,0) 70%);mix-blend-mode:screen;animation:tvg 2.3s ease-in-out infinite}
  @keyframes tvg{0%,100%{opacity:.5}30%{opacity:.9}60%{opacity:.6}}
  .hs{position:absolute;background:transparent;border:0;padding:0;cursor:pointer;border-radius:10px;outline:none}
  .hs::after{content:'';position:absolute;inset:0;border-radius:10px;border:3px solid #ffe14d;box-shadow:0 0 18px #ffe14d,inset 0 0 18px rgba(255,225,77,.5);opacity:0;transition:opacity .2s}
  .hs:hover::after,.hs:focus-visible::after,.hs.flash::after{opacity:1}
  .hs .mk{position:absolute;left:var(--mx,50%);top:var(--my,50%);width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#ffe14d;border:2px solid #000;
    box-shadow:0 0 0 0 rgba(255,225,77,.7);animation:ping 2s ease-out infinite}
  @keyframes ping{0%{box-shadow:0 0 0 0 rgba(255,225,77,.8)}100%{box-shadow:0 0 0 18px rgba(255,225,77,0)}}
  .hs .lb{position:absolute;left:var(--mx,50%);top:calc(var(--my,50%) + 14px);transform:translateX(-50%) rotate(-3deg);white-space:nowrap;background:#ffe14d;border:2px solid #000;
    font-family:'Bangers',cursive;font-size:15px;letter-spacing:1px;padding:1px 7px;color:#000;box-shadow:2px 2px 0 #000;opacity:0;transition:opacity .4s}
  #hide.labels .hs .lb{opacity:1}
  #h-phone .lb{left:0;transform:rotate(-3deg)}
  #h-bench .lb,#h-locker .lb{left:auto;right:0;transform:rotate(-3deg)}
  #h-radio .lb{left:auto;right:4px;transform:rotate(-3deg)}
  .hs.alert .mk{background:#ff3d8b;animation:ping .9s ease-out infinite}

  #hud{position:absolute;left:0;right:0;top:0;padding:max(10px,env(safe-area-inset-top)) 12px 10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
    background:linear-gradient(180deg,rgba(10,2,20,.85),rgba(10,2,20,0));pointer-events:none}
  #hud .who{color:#000;background:#fff;border:3px solid #000;box-shadow:3px 3px 0 #ff3d8b;padding:2px 10px;transform:rotate(-1.5deg);min-width:120px}
  #hud .who b{font-family:'Bangers',cursive;font-size:22px;letter-spacing:1px;display:block;line-height:1.1}
  #hud .who small{font-size:12px}
  #hud .stats{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
  #hud .pill{background:#000;color:#fff;border:2px solid #2fe0ea;padding:2px 9px;font-size:14px;font-weight:700}
  #hud .pill.cash{border-color:#7dffb2;color:#7dffb2}
  #hud .pill.heat{border-color:#ff3d8b;color:#ffb3d1}

  #sheet,.sheetx{position:absolute;left:10px;right:10px;bottom:max(12px,env(safe-area-inset-bottom));z-index:20;background:#fff;border:4px solid #000;box-shadow:7px 7px 0 #ff3d8b;
    padding:14px 16px 16px;transform:translateY(140%) rotate(1deg);transition:transform .45s cubic-bezier(.2,1.3,.4,1)}
  #sheet.open,.sheetx.open{transform:translateY(0) rotate(0)}
  .sheetx h2,#sheet h2{margin:0 0 6px;font-family:'Bangers',cursive;font-weight:400;font-size:30px;letter-spacing:1px;line-height:1}
  .sheetx p,#sheet p{margin:0 0 10px;font-size:16px;line-height:1.35}
  .sheetx .tag,#sheet .tag{display:inline-block;background:#ffe14d;border:2px solid #000;font-size:12px;font-weight:700;padding:1px 6px;margin-bottom:8px}
  .sheetx .row,#sheet .row{display:flex;gap:10px;margin-top:6px}
  .sheetx button,#sheet button{flex:1;height:48px;border:3px solid #000;font-family:'Bangers',cursive;font-size:22px;letter-spacing:1px;cursor:pointer;box-shadow:4px 4px 0 #000}
  .sheetx .ok,#sheet .ok{background:#ff3d8b;color:#fff;-webkit-text-stroke:.8px #000}
  .sheetx .no,#sheet .no{background:#eee}
  .sheetx button:active,#sheet button:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #000}
  .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:4px 0 10px}
  .grid div{aspect-ratio:1;border:2px solid #000;background:#f1ede4;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;font-weight:700;line-height:1.1;padding:2px}
  .grid div.full{background:#2fe0ea}
  #toast,.tst{position:absolute;left:50%;top:22%;z-index:30;transform:translate(-50%,-20px) rotate(-3deg);opacity:0;transition:all .35s;background:#ffe14d;border:3px solid #000;
    box-shadow:4px 4px 0 #000;font-family:'Bangers',cursive;font-size:22px;letter-spacing:1px;padding:4px 14px;white-space:nowrap;pointer-events:none}
  #toast.on,.tst.on{opacity:1;transform:translate(-50%,0) rotate(-3deg)}
  #fade{position:absolute;inset:0;background:#000;pointer-events:none;opacity:1;transition:opacity 1.2s}

  /* ===== STADTKARTE ===== */
  #map{background:#0d0618}
  #map .glow{position:absolute;border-radius:50%;mix-blend-mode:screen;pointer-events:none}
  #map .g-club{left:36%;top:27%;width:34%;height:16%;background:radial-gradient(ellipse,rgba(255,60,200,.45),rgba(255,60,200,0) 70%);animation:flicker 5s steps(1) infinite}
  #map .g-diner{left:66%;top:40%;width:36%;height:18%;background:radial-gradient(ellipse,rgba(255,90,170,.4),rgba(255,90,170,0) 70%);animation:pulse2 3s ease-in-out infinite}
  #map .g-pawn{left:62%;top:70%;width:38%;height:16%;background:radial-gradient(ellipse,rgba(255,170,40,.4),rgba(255,170,40,0) 70%);animation:flicker 7s steps(1) infinite reverse}
  #map .g-sea{left:0;top:2%;width:100%;height:20%;background:repeating-linear-gradient(100deg,rgba(255,150,220,0) 0 22px,rgba(255,150,220,.25) 24px,rgba(255,150,220,0) 28px 54px);border-radius:0;
    -webkit-mask-image:linear-gradient(180deg,transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(180deg,transparent,#000 30%,#000 70%,transparent);animation:shim 5s linear infinite}
  #map .hs .lb{opacity:1}
  #map .spot .lb{font-size:13px;padding:0 5px}

  .hs.target .mk{background:#ff3d8b;width:20px;height:20px;margin:-10px 0 0 -10px;animation:ping .9s ease-out infinite}
  .hs.target .lb{background:#ff3d8b;color:#fff}
  .hs.target .lb::before{content:'ZIEL: '}
  #maptop{position:absolute;left:0;right:0;bottom:0;padding:26px 12px max(14px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:6;
    background:linear-gradient(0deg,rgba(10,2,20,.92),rgba(10,2,20,0))}
  #map #hud .qst{display:none}
  #map #hud .who{min-width:0}
  #maptop button{background:#fff;border:3px solid #000;box-shadow:3px 3px 0 #2fe0ea;font-family:'Bangers',cursive;font-size:20px;letter-spacing:1px;padding:3px 12px;cursor:pointer}
  #mission{background:#000;color:#ffe14d;border:2px solid #ffe14d;font-size:13px;font-weight:700;padding:4px 8px;max-width:60%;text-align:right}

  /* ===== SZENE ===== */
  #scene{background:#14081f;background-image:radial-gradient(rgba(255,255,255,.06) 1.2px,transparent 1.4px);background-size:9px 9px}
  #scbox{position:absolute;left:50%;top:46%;width:min(94vw,640px);transform:translate(-50%,-50%)}
  #scbtns{position:absolute;left:12px;right:12px;bottom:max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
  #scbtns button{min-height:54px;border:4px solid #000;background:#fff;font-family:'Bangers',cursive;font-size:22px;letter-spacing:1px;cursor:pointer;box-shadow:5px 5px 0 #2fe0ea;
    display:flex;justify-content:space-between;align-items:center;padding:0 14px;color:#000}
  #scbtns button small{font-family:'Oswald',sans-serif;font-size:13px;font-weight:700;background:#000;color:#ffe14d;padding:2px 6px}
  #scbtns button.hot{background:#ff3d8b;color:#fff;-webkit-text-stroke:.8px #000;box-shadow:5px 5px 0 #ffe14d}
  #scbtns button:active{transform:translate(3px,3px);box-shadow:2px 2px 0 #000}
  #scbtns button:disabled{opacity:.45}
  .timer{margin-top:14px;border:3px solid #000;background:#fff;height:26px;position:relative;box-shadow:4px 4px 0 #000}
  .timer i{position:absolute;left:0;top:0;bottom:0;background:repeating-linear-gradient(135deg,#ffe14d 0 12px,#ffcc00 12px 24px);width:0}
  .timer span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
  .dice{position:absolute;inset:0;margin:auto;z-index:6;font-family:'Bangers',cursive;font-size:72px;color:#fff;-webkit-text-stroke:3px #000;paint-order:stroke fill;
    text-shadow:5px 5px 0 #ff3d8b;background:#000;border:4px solid #ffe14d;width:110px;height:110px;display:flex;align-items:center;justify-content:center;animation:pop .3s cubic-bezier(.2,1.8,.4,1) both}
  .result{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:6;font-family:'Bangers',cursive;font-size:clamp(40px,12vw,72px);white-space:nowrap;
    color:#ffe14d;-webkit-text-stroke:3px #000;paint-order:stroke fill;text-shadow:6px 6px 0 #ff3d8b;animation:pop .35s cubic-bezier(.2,1.8,.4,1) both}
  .result.bad{color:#fff;text-shadow:6px 6px 0 #555}
  .reward{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .reward b{background:#000;color:#7dffb2;border:2px solid #7dffb2;padding:3px 9px;font-size:15px}
  .reward b.h{color:#ffb3d1;border-color:#ff3d8b}
  .reward b.x{color:#2fe0ea;border-color:#2fe0ea}
  #hud .xp{width:100%;height:6px;background:#ddd;border:1px solid #000;margin-top:3px}
  #hud .xp i{display:block;height:100%;background:#2fe0ea;width:0;transition:width .8s}

  /* ===== Neues Menü-Design (statt weißer Kästen) ===== */

<script>
(function(){
  const $=id=>document.getElementById(id);
  function fit(stage){
    const vw=innerWidth, vh=innerHeight, r=944/1680;
    if(stage.id==='stageC'){if(MV)fitMap();return;}
    if(stage.id==='stageB'||stage.id==='stageD'||stage.id==='stageP'||stage.id==='stageH'){
      // Versteck: ganze Breite zeigen, damit alle Objekte erreichbar sind; unten bündig
      const w=vw*1.04, h=w/r;
      stage.style.width=w+'px'; stage.style.height=h+'px';
      stage.style.top=(h<vh? (vh-h/2+vw*.0)+'px' : '50%');
      if(h<vh) stage.style.top=(vh-h/2)+'px';
      return;
    }
    let w=vw, h=vw/r; if(h<vh){h=vh; w=vh*r;}
    stage.style.width=(w*1.06)+'px'; stage.style.height=(h*1.06)+'px';
  }
  const stages=[$('stageA'),$('stageB'),$('stageC'),$('stageD'),$('stageP'),$('stageH')];
  const fitAll=()=>stages.forEach(fit); fitAll(); addEventListener('resize',fitAll);

  let scene='start';
  function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));scene=id;if(id==='hide'||id==='diner'||id==='place'||id==='map'||id==='heist'){const sc=document.getElementById(id);['hud','veil','bust','paper','menu2','dlg','toast3'].forEach(x=>{const e=document.getElementById(x);if(e)sc.appendChild(e);});sc.classList.remove('talk');const d=document.getElementById('dlg');if(d)d.classList.remove('on');}}
  function wipeTo(fn){const w=$('wipe');w.classList.remove('go');void w.offsetWidth;w.classList.add('go');setTimeout(fn,500);}

  // ---------- Parallax ----------
  let tx=0,ty=0,cx=0,cy=0,auto=true;
  function setTarget(x,y){tx=Math.max(-1,Math.min(1,x));ty=Math.max(-1,Math.min(1,y));auto=false;clearTimeout(setTarget.t);setTarget.t=setTimeout(()=>auto=true,3000);}
  addEventListener('pointermove',e=>setTarget((e.clientX/innerWidth-.5)*2,(e.clientY/innerHeight-.5)*2));
  const startLayers=[['bg',8],['carlayer',14],['fig',26],['dust',40]].map(([id,d])=>[$(id),d]);
  const hideLayers=[[$('gl'),10]];
  const mapLayers=[[$('ml'),12]];
  const dinerLayers=[[$('dl'),10]];

  // ---------- Rauch & Partikel ----------
  const sm=$('smoke'), sx=sm.getContext('2d'), du=$('dust'), dx=du.getContext('2d');
  function size(){[sm,du].forEach(c=>{c.width=c.clientWidth*devicePixelRatio;c.height=c.clientHeight*devicePixelRatio;});}
  size(); addEventListener('resize',()=>setTimeout(size,50));
  const puffs=[], motes=[];
  for(let i=0;i<34;i++)motes.push({x:Math.random(),y:Math.random(),r:Math.random()*2.2+.6,s:Math.random()*.00025+.00008,p:Math.random()*6.28,c:Math.random()<.5?'255,120,210':'120,240,255'});
  const t0=performance.now();
  function frame(now){
    const t=(now-t0)/1000;
    if(auto){tx=Math.sin(t*.35)*.45;ty=Math.cos(t*.27)*.25;}
    cx+=(tx-cx)*.06; cy+=(ty-cy)*.06;
    const L=scene==='hide'?hideLayers:scene==='map'?[]:scene==='diner'?dinerLayers:scene==='place'?[[$('pl'),10]]:scene==='heist'?[[$('hl'),8]]:scene==='start'?startLayers:[];
    L.forEach(([el,d])=>{el.style.transform=`translate3d(${-cx*d}px,${-cy*d*.6}px,0)`;});
    if(scene==='start'){

  // ---------- Job-Ablauf: Timer -> Ereignis -> Entscheidung/Würfel -> Belohnung ----------
  let jobTimer=null;
  let JOB=null;
  function startJob(j,who,again){
    if(JOB){say(who,`Du hast doch schon was am Laufen: ${JOB.j.n}. Eins nach dem anderen.`,[{t:'Stimmt.',f:closeDlg}]);return;}
    if(nrg<j.e){say(who,'Du siehst völlig fertig aus. Iss erst mal was oder schlaf dich aus.',[{t:'Okay.',f:closeDlg}]);return;}
    nrg-=j.e; hud(); sfx('click');
    const dur=j.t*6000; JOB={j,who,start:Date.now(),end:Date.now()+dur,done:false};
    say(who,'Alles klar. Ich meld mich, wenn’s ernst wird. Mach in der Zwischenzeit, was du willst.',[{t:'Bis gleich.',f:closeDlg}]);
    renderJob(); clearInterval(jobTimer); jobTimer=setInterval(renderJob,250);
  }
  function renderJob(){
    const jb=$('jobbar');
    if(!JOB){jb.classList.remove('on','done');return;}
    jb.classList.add('on');
    const left=Math.max(0,JOB.end-Date.now()), pct=100-left/(JOB.end-JOB.start)*100;
    jb.querySelector('i').style.width=pct+'%';
    jb.querySelector('img').src=people[JOB.who].p||'';
    if(left<=0&&!JOB.done){JOB.done=true;sfx('cash');}
    jb.classList.toggle('done',JOB.done);
    jb.querySelector('b').textContent=JOB.j.n;
    jb.querySelector('span').textContent=JOB.done?'FERTIG – TIPPEN':`${Math.floor(left/60000)}:${String(Math.ceil(left/1000)%60).padStart(2,'0')}`;
  }
  function openJob(){
    if(!JOB)return;
    if(!JOB.done){JOB.end=Date.now();renderJob();return;} // Testmodus: Tippen = sofort fertig
    if(!['hide','diner','place','map'].includes(scene))return;
    const {j,who}=JOB; clearInterval(jobTimer); JOB=null; renderJob(); show(scene); if(Math.random()<.3)jobEvent(j,who,()=>closeDlg()); else jobResult(j,who,()=>closeDlg(),Math.random()<.15?'win':'safe');
  }
  function jobEvent(j,who,again){
    const ch=Math.max(5,Math.min(95,j.p+(buff&&j.stat==='Charme'?15:0)+(statVal(j.stat)-10)*2+(hasSet('waffen')?5:0)));
    sayRaw(who,`<b>Zwischenfall!</b><br>${j.ev}`,[
      {t:`${j.safe}<small>SICHER · $${j.m}</small>`,f:()=>jobResult(j,who,again,'safe')},
      {t:`${j.risk}<small>${j.stat.toUpperCase()} · ${ch} % · $${j.m*2}${j.h?' · Heat':''}</small>`,f:()=>{if(j.stat==='Charme'&&buff){buff=false;hud();}diceRoll(who,ch,j.stat,win=>jobResult(j,who,again,win?'win':'lose'));}}]);
  }
  function diceRoll(who,ch,stat,cb){
    let n=0; const r=Math.floor(Math.random()*100)+1;
    const draw=v=>sayRaw(who,`<div class="dice2">${v}</div><div class="dsub">Würfel auf ${stat} · Ziel: ${ch} oder weniger</div>`,[]);
    const it=setInterval(()=>{n++;draw(n<16?Math.floor(Math.random()*100)+1:r);if(n>=16){clearInterval(it);setTimeout(()=>cb(r<=ch),800);}},65);
  }
  function jobResult(j,who,again,res){

    sayRaw(who,`<div class="rbig${bad?' bad':''}">${big}</div>${txt}<div class="reward"><b>+ $${m}</b><b class="x">+ ${x} XP</b>${h?'<b class="h">+1 Heat ★</b>':''}${rp?`<b class="x">+${rp} Ruf</b>`:''}</div>`,
      [{t:'Fertig',f:closeDlg}]);

  const SHOPT={joe:'Unter der Theke <small>MATERIAL, KLAMOTTEN & WAFFEN</small>',sunny:'Klamotten kaufen <small>STRAND-STYLE</small>',duke:'Edle Klamotten <small>FÜR LEUTE MIT GELD</small>'};
  const price=(npc,p)=>Math.round(p*(npc==='joe'&&FACTION==='kartell'?.75:1));
  function shopMenu(npc,msg){
    const ch=SHOP[npc].filter(([id,p0,rq])=>!rq||lvl>=rq-1).map(([id,p0,rq])=>{const p=price(npc,p0);if(rq&&lvl<rq)return {t:`🔒 ${ITEMS[id].n} <small>ab Stufe ${rq}</small>`,f:()=>shopMenu(npc,'Erst wenn du mehr Erfahrung hast.')};return {t:`${ITEMS[id].n} <small>$${p} · ${ITEMS[id].t==='cloth'||ITEMS[id].t==='weapon'?ITEMS[id].d:'im Spind: '+STASH.filter(x=>x===id).length}</small>`,f:()=>{
      if(cash<p){shopMenu(npc,'Ohne Kohle keine Ware.');return;}addReward(-p,0,0);STASH.push(id);track('bought');sfx('cash');shopMenu(npc,`${ITEMS[id].n} – liegt in deinem Spind. Noch was?`);}};});
    ch.push({t:'Fertig',f:()=>npcMenu('Sonst noch was?')});
    say(npc,msg||({joe:'Schrott hab ich genug. Kostet aber.',tito:'Ich kenn da jemanden, der kennt jemanden. Was brauchst du?',sunny:'Bro, mit dem Look kommst du überall rein!',duke:'Qualität hat ihren Preis, Junge.'}[npc]),ch);
  }
  // Dee kauft Beute
  // ---------- Verkaufen mit Auswahl ----------
  let SELL={rate:.6,who:'dee',sel:{},after:null};
  function openSell(rate,who,after){SELL={rate,who,sel:{},after,dirty:Object.values(EMP.biz).some(x=>x.lv)};const ids=[...new Set(STASH.filter(id=>ITEMS[id]&&ITEMS[id].t==='loot'))];ids.forEach(id=>SELL.sel[id]=STASH.filter(x=>x===id).length);
    if(!ids.length){toastMsg('KEINE BEUTE IM SPIND');if(after)after(0);return;}$('sellov').classList.add('on');renderSell();}
  function renderSell(){const P=$('sellp');const ids=[...new Set(STASH.filter(id=>ITEMS[id]&&ITEMS[id].t==='loot'))].sort((a,b)=>ITEMS[b].v-ITEMS[a].v);
    const R=SELL.dirty?Math.min(1,SELL.rate*1.4):SELL.rate;const tot=ids.reduce((s,id)=>s+Math.round(ITEMS[id].v*R)*(SELL.sel[id]||0),0);
    P.innerHTML=`<div class="seth"><b>${SELL.who==='dee'?'DEE – HEHLEREI':'HEHLER-KURIER'}</b><button type="button" id="sellx">✕</button></div>
      <div class="sellpay"><button type="button" data-pay="0" class="${SELL.dirty?'':'on'}">💵 SAUBER<small>${Math.round(SELL.rate*100)} % vom Wert</small></button><button type="button" data-pay="1" class="${SELL.dirty?'on':''}">🧼 SCHWARZGELD<small>${Math.round(Math.min(1,SELL.rate*1.4)*100)} % · in deinen Läden waschen</small></button></div>
      <div class="sellbar"><button type="button" id="sall">Alles</button><button type="button" id="snone">Nichts</button></div>
      <div class="mbody">${ids.map(id=>{const have=STASH.filter(x=>x===id).length,n=SELL.sel[id]||0,p=Math.round(ITEMS[id].v*SELL.rate);
        return `<div class="srow ${n?'on':''}"><img src="${ico(id)}" alt=""><div><b>${ITEMS[id].n}</b><small>$${p} pro Stück · im Spind: ${have}</small></div>
        <div class="sq"><button type="button" data-sm="${id}">−</button><i>${n}</i><button type="button" data-sp="${id}">+</button></div></div>`;}).join('')}</div>
      <button type="button" class="mbig" id="sgo" ${tot?'':'disabled'}>VERKAUFEN · +$${fmt(tot)}</button>`;
    $('sellx').onclick=closeSell;P.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>{SELL.dirty=b.dataset.pay==='1';renderSell();});$('sall').onclick=()=>{ids.forEach(id=>SELL.sel[id]=STASH.filter(x=>x===id).length);renderSell();};$('snone').onclick=()=>{ids.forEach(id=>SELL.sel[id]=0);renderSell();};
    P.querySelectorAll('[data-sm]').forEach(b=>b.onclick=()=>{const id=b.dataset.sm;SELL.sel[id]=Math.max(0,(SELL.sel[id]||0)-1);renderSell();});
    P.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>{const id=b.dataset.sp;SELL.sel[id]=Math.min(STASH.filter(x=>x===id).length,(SELL.sel[id]||0)+1);renderSell();});
    P.querySelectorAll('.srow img').forEach((im,i)=>im.onclick=()=>{const id=ids[i];const h=STASH.filter(x=>x===id).length;SELL.sel[id]=SELL.sel[id]?0:h;renderSell();});
    $('sgo').onclick=()=>{let v=0,n=0;Object.entries(SELL.sel).forEach(([id,k])=>{for(let i=0;i<k;i++){const j=STASH.indexOf(id);if(j>=0){STASH.splice(j,1);v+=Math.round(ITEMS[id].v*R);n++;}}});
      if(!v)return;if(SELL.dirty){EMP.dirty=(EMP.dirty||0)+v;addReward(0,Math.min(30,5+n),0);}else addReward(v,Math.min(30,5+n),0);track('sold',v);sfx('cash');toastMsg(`${n} TEILE VERKAUFT: +$${fmt(v)}${SELL.dirty?' SCHWARZGELD':''}`);const a=SELL.after;closeSell();if(a)a(v);};
  }
  function closeSell(){$('sellov').classList.remove('on');saveGame();if($('inv').classList.contains('on'))renderInv();}
  function sellLoot(){
    if(!STASH.some(id=>ITEMS[id].t==='loot')){say('dee','Du hast nichts, was mich interessiert, Schätzchen.',[{t:'OK',f:()=>npcMenu('Sonst noch was?')}]);return;}
    closeDlg();openSell(deeRate(),'dee',v=>{say('dee',v?'Angenehm, mit dir Geschäfte zu machen.':'Wie du meinst.',[{t:'Bis bald',f:closeDlg}]);});
  }
  function sellLootOld(){
    const loot=STASH.filter(id=>ITEMS[id].t==='loot'); if(!loot.length){say('dee','Du hast nichts, was mich interessiert, Schätzchen.',[{t:'OK',f:()=>npcMenu('Sonst noch was?')}]);return;}
    const v=Math.round(loot.reduce((s,id)=>s+ITEMS[id].v,0)*deeRate());
    say('dee',`${loot.length} Teile … heiße Ware. Ich geb dir ${v} Dollar. Keine Fragen, kein Feilschen.`,[
      {t:`Deal <small>+$${v}</small>`,f:()=>{STASH=STASH.filter(id=>ITEMS[id].t!=='loot');addReward(v,10,0);track('sold',v);sfx('cash');say('dee','Angenehm, mit dir Geschäfte zu machen.',[{t:'Bis bald',f:closeDlg}]);}},
      {t:'Lieber behalten',f:()=>npcMenu('Wie du meinst.')}]);
  }

  $('hbagb').addEventListener('click',e=>{e.stopPropagation();if(H)showBag();});
  // ---------- Radio: kleiner Synthwave-Loop ----------
  function radio(){
    const tm=scene==='diner'?toast3:toastMsg;
    if(!window.NHA){tm('KEIN TON VERFÜGBAR');return;}
    NHA.start();const n=NHA.station();tm(n==='AUS'?(scene==='diner'?'JUKEBOX AUS':'RADIO AUS'):(scene==='diner'?'JUKEBOX: ':'RADIO AN: ')+n);
  }
})();
</script>
<script>
(function(){
  const $=id=>document.getElementById(id);
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  let dp=null;
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;});
  const standalone=()=>window.matchMedia('(display-mode: standalone)').matches||window.matchMedia('(display-mode: fullscreen)').matches||navigator.standalone;
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  function upd(){const t=$('sInstTxt');
    if(standalone())t.textContent='Läuft schon als App ✔';
    else if(dp)t.textContent='Tippen – dann „Installieren“ bestätigen';
    else if(ios)t.textContent='Safari: Teilen-Symbol □↑ → „Zum Home-Bildschirm“';
    else t.textContent='Chrome-Menü ⋮ → „Zum Startbildschirm hinzufügen“ bzw. „App installieren“';}
  $('gear').onclick=e=>{e.stopPropagation();upd();snd();$('setov').classList.add('on');};
  $('setx').onclick=()=>$('setov').classList.remove('on');
  function snd(){if(!window.NHA)return;const s=NHA.settings;$('sMu').value=Math.round(s.mu*100);$('sFx').value=Math.round(s.fx*100);$('sMuV').textContent=$('sMu').value+'%';$('sFxV').textContent=$('sFx').value+'%';$('sStN').textContent=NHA.stationName();}
  $('sMu').oninput=e=>{NHA.start();NHA.setMusic(e.target.value/100);snd();};
  $('sFx').oninput=e=>{NHA.setFx(e.target.value/100);snd();};
  $('sFx').onchange=()=>NHA.sfx('cash');
  $('sSt').onclick=()=>{NHA.start();NHA.station();snd();};
  $('setov').addEventListener('click',e=>{if(e.target.id==='setov')$('setov').classList.remove('on');});
  $('sInstall').onclick=async()=>{if(standalone()){upd();return;}
    if(dp){dp.prompt();try{const r=await dp.userChoice;if(r.outcome==='accepted')$('sInstTxt').textContent='Wird installiert – schau auf deinen Startbildschirm';}catch(e){}dp=null;return;}
    upd();$('sInstTxt').style.color='#ffe14d';};
  window.addEventListener('appinstalled',()=>{$('sInstTxt').textContent='Installiert ✔';});
  $('sFull').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch(e){}};
  let rs=0;$('sReset').onclick=()=>{if(rs){if(window.NH_GAME)NH_GAME.wipe();window.__nhReady=false;location.reload();return;}rs=1;$('sReset').querySelector('b').textContent='Nochmal tippen = alles löschen';setTimeout(()=>{rs=0;$('sReset').querySelector('b').textContent='Neues Spiel';},3000);};
  document.querySelectorAll(".tsth button").forEach(b=>b.onclick=()=>{if(window.NH_GAME)NH_GAME.cheat(b.dataset.c);b.style.background='#7dffb2';setTimeout(()=>b.style.background='',300);});
  setInterval(()=>{const m=$('map'),s=$('start'),i=$('intro');const vis=id=>{const x=document.getElementById(id);return x&&x.classList.contains('on');};const sh=document.getElementById('sheet');
    const hide=vis('map')||!!document.getElementById('pixh')||vis('dlg')||vis('inv')||(sh&&sh.classList.contains('open'))||vis('paper')||vis('menu2');$('gear').style.display=hide?'none':'';const tr=$('trophy');if(tr)tr.style.display=(hide||vis('start')||vis('intro'))?'none':'';const em=$('empire');if(em)em.style.display=(hide||vis('start')||vis('intro'))?'none':'';const pb=$('phoneb');if(pb)pb.style.display=(hide||vis('start')||vis('intro'))?'none':'';},400);
})();
</script>
