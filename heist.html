function buildGolden(){
  W=30;H=31;G=grid(W,H,'#');FL=grid(W,H,'wood');CT=grid(W,H,null);OBJ=[];
  fillR(1,1,19,11,'.','chk');fillR(20,7,28,11,'.','chk');fillR(21,1,28,5,'.','metal');G[6][23]='K';
  fillR(1,13,7,22,'.','wood');fillR(9,13,19,22,'.','conc');fillR(21,13,28,17,'.','carpet');fillR(21,19,28,22,'.','wood');
  [[2,2],[7,2],[12,2],[2,5],[7,5],[12,5],[23,9],[17,2]].forEach(([x,y])=>place('V',x,y));
  for(let x=1;x<=28;x++)if(G[7][x]==='.')G[7][x]='B';hasLasers=lasersOn=true;
  G[10][0]='O';FL[10][0]='chk';
  G[12][5]='L';G[12][14]='d';G[16][8]='d';G[15][20]='L';G[21][20]='d';
  place('S',1,14);place('S',1,18);[[5,15],[6,20],[4,21],[18,20],[10,21]].forEach(([x,y])=>place('C',x,y));
  place('D',23,14);place('X',27,13);place('mon',24,19);place('Z',27,19);place('Z',28,19);place('fuse',9,13);
  G[23][14]='L';G[23][4]='W';
  fillR(1,24,28,29,'.','street');place('trash',2,25);place('trash',26,25);for(let x=11;x<=16;x++){G[28][x]='E';}
  [[22,2],[25,2],[22,4],[26,4]].forEach(([x,y])=>place('G',x,y));place('Y',27,2);place('Y',27,4);
  yardTop=24;EXITS=['E','O'];ACC='#ff3d8b';
  P.x=8.5*T;P.y=27*T;
  guards=[mkG([[3,9.5],[18,9.5],[18,11],[26,11],[26,9],[3,9]]),mkG([[11,14],[18,14],[18,21.5],[11,21.5]]),mkG([[22,16],[27,16],[27,14.5],[22,14.5]]),mkG([[10,4],[18,4],[18,6],[10,6]])];
  cams=[{x:10*T,y:7.6*T,base:Math.PI/2,sw:0,sus:0},{x:25*T,y:7.6*T,base:Math.PI/2,sw:2,sus:0},{x:14.5*T,y:12.7*T,base:Math.PI/2,sw:1,sus:0}];
  LIGHTS=[[4,3],[10,3],[16,3],[24,3],[5,9],[14,9],[24,9],[4,16],[14,16],[24,15],[24,21],[6,26],[20,26],[14,27]];
  LABELS=[['GOLDEN PALM',3,1,'#ff3d8b'],['TRESOR',23,1,'#7ff6ff'],['LAGER',2,13,'#7ff6ff'],['BÜRO',23,13,'#7ff6ff'],['SECURITY',21,19,'#7ff6ff']];
  noteIn(OBJ.find(o=>o.kind==='S'));
  fillLoot('golden');
}
// ---------- Generator ----------
const BTYPES={
  werkstatt:{n:'Autowerkstatt',cols:2,rows:2,yard:'street',entry:'halle',rooms:['halle','lager','buero','umkleide','teile'],guards:[1,1,2],cams:[0,0,1],alarm:[0,0,1],lasers:0,lockP:.35,acc:'#ff9f43'},
  apotheke:{n:'Apotheke',cols:3,rows:2,yard:'street',entry:'verkauf',rooms:['verkauf','labor','lager','buero','personal','kuehl'],guards:[1,2,2],cams:[1,1,2],alarm:[1,1,1],lasers:0,lockP:.45,acc:'#7dffb2'},
  villa:{n:'Villa',cols:3,rows:3,yard:'grass',entry:'wohnen',rooms:['wohnen','kueche','schlaf','arbeit','bad','garage','security','gast','salon'],guards:[2,3,3],cams:[2,2,3],alarm:[1,1,1],lasers:1,lockP:.5,acc:'#2fe0ea'}
};
const ROOMS={
  halle:{n:'WERKHALLE',fl:'conc',f:['A','R','R','C','lift','C']},lager:{n:'LAGER',fl:'conc',f:['S','S','C','C','C']},buero:{n:'BÜRO',fl:'carpet',f:['D','X','plant','S']},
  umkleide:{n:'UMKLEIDE',fl:'lab',f:['Z','Z','Z','table']},teile:{n:'TEILELAGER',fl:'conc',f:['S','R','C','S']},
  verkauf:{n:'VERKAUF',fl:'lab',f:['V','V','counter','plant']},labor:{n:'LABOR',fl:'lab',f:['S','table','S','C']},personal:{n:'PERSONAL',fl:'wood',f:['Z','Z','K','table']},
  kuehl:{n:'KÜHLRAUM',fl:'metal',f:['K','K','S','C']},
  wohnen:{n:'WOHNZIMMER',fl:'carpet',f:['sofa','table','V','plant','plant']},kueche:{n:'KÜCHE',fl:'lab',f:['counter','K','table']},schlaf:{n:'SCHLAFZIMMER',fl:'carpet',f:['bed','Q','Q']},
  arbeit:{n:'ARBEITSZIMMER',fl:'wood',f:['D','X','S','plant']},bad:{n:'BAD',fl:'lab',f:['Q','plant']},garage:{n:'GARAGE',fl:'conc',f:['A','S','C']},
  security:{n:'SECURITY',fl:'wood',f:['mon','Z','Z']},gast:{n:'GÄSTEZIMMER',fl:'carpet',f:['bed','Q']},salon:{n:'SALON',fl:'chk',f:['V','V','sofa','plant']}
};
function buildGen(cfg){
  const B=BTYPES[cfg.type],d=Math.max(0,Math.min(2,(cfg.diff||1)-1));ACC=B.acc;
  const C=B.cols,R=B.rows,yardH=6;W=C*9+1;H=R*7+1+yardH;
  G=grid(W,H,'#');FL=grid(W,H,'wood');CT=grid(W,H,null);OBJ=[];LABELS=[];LIGHTS=[];
  yardTop=R*7+1;
  const rooms=[];
  for(let j=0;j<R;j++)for(let i=0;i<C;i++)rooms.push({i,j,x0:1+i*9,y0:1+j*7,nb:[]});
  const ro=(i,j)=>(i>=0&&i<C&&j>=0&&j<R)?rooms[j*C+i]:null;
  // Spannbaum
  const seen=new Set();const st=[ro(ri(0,C-1),ri(0,R-1))];seen.add(st[0]);const edges=[];
  while(st.length){const r=st[st.length-1];const n=[[1,0],[-1,0],[0,1],[0,-1]].map(([a,b])=>ro(r.i+a,r.j+b)).filter(x=>x&&!seen.has(x));
    if(!n.length){st.pop();continue;}const q=pick(n);seen.add(q);edges.push([r,q]);st.push(q);}
  // Extra-Verbindung
  for(let k=0;k<1+(C*R>6?1:0);k++){const a=pick(rooms),dirs=[[1,0],[0,1]],dd=pick(dirs),b=ro(a.i+dd[0],a.j+dd[1]);if(b&&!edges.some(e=>(e[0]===a&&e[1]===b)||(e[0]===b&&e[1]===a)))edges.push([a,b]);}
  // Raumtypen
  const entry=ro(Math.floor(C/2),R-1);
  let types=shuf(B.rooms.filter(t=>t!==B.entry)).slice(0,rooms.length-1);
  rooms.filter(r=>r!==entry).forEach((r,k)=>r.t=types[k%types.length]);entry.t=B.entry;
  // Safe-Raum möglichst weit weg
  rooms.forEach(r=>{const R0=ROOMS[r.t];fillR(r.x0,r.y0,r.x0+7,r.y0+5,'.',R0.fl);LABELS.push([R0.n,r.x0,r.y0,'#7ff6ff']);LIGHTS.push([r.x0+4,r.y0+3]);});
  // Türen
  edges.forEach(([a,b])=>{let x,y;if(a.j===b.j){x=Math.max(a.x0,b.x0)-1;y=a.y0+3;}else{x=a.x0+4;y=Math.max(a.y0,b.y0)-1;}
    const locked=rnd()<B.lockP+d*.1;G[y][x]=locked?'L':'d';FL[y][x]=ROOMS[a.t].fl;a.nb.push({r:b,x,y,open:!locked});b.nb.push({r:a,x,y,open:!locked});});
  // Eingänge
  G[yardTop-1][entry.x0+4]='L';FL[yardTop-1][entry.x0+4]=ROOMS[entry.t].fl;
  const wr=C>1?pick(rooms.filter(r=>r.j===R-1&&r!==entry)):entry;G[yardTop-1][wr.x0+(wr===entry?1:2)]='W';
  // Hof
  fillR(1,yardTop,W-2,H-2,'.',B.yard);
  const ex=Math.floor(W/2);for(let x=ex-2;x<=ex+2;x++)G[H-2][x]='E';
  if(B.yard==='grass'){for(let k=0;k<6;k++){const x=ri(1,W-2),y=ri(yardTop+1,H-4);if(G[y][x]==='.'&&Math.abs(x-ex)>3&&Math.abs(x-(entry.x0+4))>1)place('bush',x,y);}}
  else{place('trash',1,yardTop+1);if(G[yardTop+1][W-2]==='.')place('trash',W-2,yardTop+1);}
  LIGHTS.push([4,yardTop+2],[W-5,yardTop+2],[ex,H-3]);
  EXITS=['E'];P.x=(ex+.5)*T;P.y=(H-3)*T;
  // Möbel
  rooms.forEach(r=>{const res=(x,y)=>(x>=r.x0+3&&x<=r.x0+5)||y===r.y0+3;
    const fits=(x,y,w,h)=>{for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++){if(xx<r.x0||xx>r.x0+7||yy<r.y0||yy>r.y0+5||G[yy][xx]!=='.'||res(xx,yy))return false;}return true;};
    ROOMS[r.t].f.forEach(k=>{const[w,h]=KSIZE[k];const cand=[];for(let y=r.y0;y<=r.y0+5;y++)for(let x=r.x0;x<=r.x0+7;x++)if(fits(x,y,w,h)){const edge=(y===r.y0?0:y+h-1===r.y0+5?1:(x===r.x0||x+w-1===r.x0+7)?2:3);cand.push({x,y,e:edge+rnd()*.9});}
      cand.sort((a,b)=>a.e-b.e);if(cand.length&&cand[0].e<3)place(k,cand[0].x,cand[0].y);});});
  // Alarmanlage am Eingang
  if(B.alarm[d]){const r=entry;for(const[x,y]of[[r.x0+6,r.y0+5],[r.x0+2,r.y0+5],[r.x0+7,r.y0+4],[r.x0,r.y0+4]]){if(G[y][x]==='.'){place('panel',x,y);alarmPanel=armed=true;break;}}}
  // Laser + Stromkasten
  if(B.lasers&&d>=0){const lr=pick(rooms.filter(r=>r!==entry));for(let x=lr.x0;x<=lr.x0+7;x++)if(G[lr.y0+1][x]==='.')G[lr.y0+1][x]='B';
    const fr=pick(rooms.filter(r=>r!==lr));for(const[x,y]of[[fr.x0+2,fr.y0+4],[fr.x0+6,fr.y0+4],[fr.x0+1,fr.y0+1]]){if(G[y][x]==='.'){place('fuse',x,y);hasLasers=lasersOn=true;break;}}
    if(!hasLasers)for(let x=lr.x0;x<=lr.x0+7;x++)if(G[lr.y0+1][x]==='B')G[lr.y0+1][x]='.';}
  // Kameras
  cams=[];shuf(rooms.filter(r=>r!==entry)).slice(0,B.cams[d]).forEach((r,k)=>{const left=rnd()<.5;cams.push({x:(left?r.x0+.4:r.x0+7.6)*T,y:(r.y0+.2)*T,base:left?Math.PI*.3:Math.PI*.7,sw:k*1.7,sus:0});});
  // Wachen
  guards=[];const gr=shuf(rooms.filter(r=>r!==entry));
  for(let k=0;k<B.guards[d];k++){const r0=gr[k%gr.length];const ctr=r=>[r.x0+4.5,r.y0+3.5];const path=[ctr(r0)];let cur=r0,prev=null;
    for(let s=0;s<3;s++){const n=cur.nb.filter(e=>e.open&&e.r!==prev);if(!n.length)break;const e=pick(n);path.push([e.x+.5,e.y+.5]);path.push(ctr(e.r));prev=cur;cur=e.r;}
    if(path.length===1){const[cx,cy]=path[0];path.push([cx,cy-2],[cx,cy],[cx-3,cy],[cx+2,cy]);}
    else{const back=path.slice(1,-1).reverse();path.push(...back);}
    guards.push(mkG(path));}
  // Safe-Code-Zettel
  const conts=OBJ.filter(o=>o.cont&&o.kind!=='X');if(OBJ.some(o=>o.kind==='X')&&conts.length)noteIn(pick(conts));
  fillLoot(cfg.type);
}
function noteIn(o){if(o){o.cont.note=true;}}
function fillLoot(tab){
  OBJ.forEach(o=>{if(!o.cont)return;const L=LOOT[tab][o.kind]||['geld'];const C=o.cont;
    const n=o.kind==='X'?3:o.kind==='G'?2:o.kind==='A'?3:ri(1,3);
    for(let k=0;k<n;k++){const id=pick(L);const p=fit(C.items,4,3,id);if(p)C.items.push(p);}
    if(o.kind==='D'&&tab==='golden'){const p=fit(C.items,4,3,'karte');if(p)C.items.unshift(p);}});
}
function setupDoors(){DOORS={};for(let y=0;y<H;y++)for(let x=0;x<W;x++){const c=G[y][x];if('LKW'.includes(c))DOORS[x+','+y]={type:c,open:false,x,y};}}
function isSolid(x,y){const c=at(x,y);if(c==='#'||c==='%'||c==='F'||c==='M'||c==='P')return true;if('LKW'.includes(c))return !DOORS[x+','+y].open;return false;}

// ================= Raster =================
let BW=5,BH=4,BAG=[];
function dims(p){const t=IT[p.id];return p.r?[t.h,t.w]:[t.w,t.h];}
function occ(list,cw,ch,skip){const g=Array.from({length:ch},()=>Array(cw).fill(0));list.forEach(p=>{if(p===skip)return;const[w,h]=dims(p);for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(g[p.y+y])g[p.y+y][p.x+x]=1;});return g;}
function canPlace(list,cw,ch,id,x,y,r,skip){const t=IT[id],w=r?t.h:t.w,h=r?t.w:t.h;if(x<0||y<0||x+w>cw||y+h>ch)return false;const g=occ(list,cw,ch,skip);for(let yy=0;yy<h;yy++)for(let xx=0;xx<w;xx++)if(g[y+yy][x+xx])return false;return true;}
function fit(list,cw,ch,id){for(const r of[0,1])for(let y=0;y<ch;y++)for(let x=0;x<cw;x++)if(canPlace(list,cw,ch,id,x,y,r))return{id,x,y,r};return null;}
const bagVal=()=>BAG.reduce((s,p)=>s+(IT[p.id].mat?0:IT[p.id].v),0);
const hasLO=id=>Object.values(LO).includes(id);
const hasCard=()=>BAG.some(p=>p.id==='karte');

function mkG(path){return{x:path[0][0]*T,y:path[0][1]*T,dir:0,wp:0,path,sus:0,mode:'patrol',tx:0,ty:0,step:0,look:0,moving:false,down:false,stun:0,stuck:0};}
let alarm=0,cop=null,busy=null,state='load',rings=[],smokes=[],heat=0,flashes=[];
const jammed=()=>performance.now()<jamUntil;
const lasersActive=()=>lasersOn&&!jammed();
const camsActive=()=>camsOn&&!jammed();

let jx=0,jy=0,jid=null,jcx=0,jcy=0;const st=$('stick'),sk=st.querySelector('i');

$('joy').addEventListener('pointermove',e=>{if(e.pointerId!==jid)return;let dx=e.clientX-jcx,dy=e.clientY-jcy;const d=Math.hypot(dx,dy),m=46;if(d>m){dx*=m/d;dy*=m/d;}jx=dx/m;jy=dy/m;sk.style.transform=`translate(${dx}px,${dy}px)`;});
const jend=e=>{if(e.pointerId!==jid)return;jid=null;jx=jy=0;st.style.display='none';sk.style.transform='';};

function px(c,x,y,w,h,col){c.fillStyle=col;c.fillRect(x,y,w,h);}
let tiles,tx;
function floorTile(x,y){const X=x*T,Y=y*T,f=FL[y][x],odd=(x+y)%2;
  if(f==='chk'){px(tx,X,Y,T,T,odd?'#2a1f3a':'#d9ccb6');px(tx,X,Y,T,1,odd?'#3a2c50':'#f2e6d2');}
  else if(f==='street'){px(tx,X,Y,T,T,'#1a1726');px(tx,X+((x*7+y*3)%13),Y+((x*5+y)%11),2,1,'#2b2840');if((x*3+y)%7===0)px(tx,X+3,Y+9,7,2,'rgba(255,61,139,.22)');if((x*5+y)%9===0)px(tx,X+8,Y+3,5,2,'rgba(47,224,234,.18)');}
  else if(f==='grass'){px(tx,X,Y,T,T,odd?'#1d4a2c':'#1f5030');for(let i=0;i<4;i++)px(tx,X+((x*5+i*7+y)%14),Y+((y*3+i*5)%14),1,2,'#2e6e40');}
  else if(f==='conc'){px(tx,X,Y,T,T,'#3a3a48');px(tx,X,Y,T,1,'#4a4a5a');px(tx,X,Y,1,T,'#2c2c38');if((x*7+y*3)%11===0)px(tx,X+4,Y+6,6,3,'rgba(10,10,10,.35)');}
  else if(f==='metal'){px(tx,X,Y,T,T,'#4a4a52');px(tx,X,Y,T,1,'#5a5a64');px(tx,X+8,Y,1,T,'#3a3a42');px(tx,X+3,Y+3,1,1,'#6a6a74');px(tx,X+12,Y+12,1,1,'#6a6a74');}
  else if(f==='lab'){px(tx,X,Y,T,T,'#c8d4dc');px(tx,X,Y,T,1,'#9aa8b4');px(tx,X,Y,1,T,'#9aa8b4');px(tx,X+8,Y,1,T,'#b0bcc6');px(tx,X,Y+8,T,1,'#b0bcc6');}
  else if(f==='carpet'){px(tx,X,Y,T,T,'#5a1f3a');if(odd)px(tx,X+6,Y+6,4,4,'#6a2846');px(tx,X+((x*3)%16),Y+((y*7)%16),1,1,'#7a3050');}
  else{px(tx,X,Y,T,T,'#3b2618');for(let i=0;i<T;i+=4)px(tx,X,Y+i,T,1,'#2c1b10');px(tx,X+((y%2)?4:10),Y,1,T,'#2c1b10');}}
function drawObj(o){const X=o.x*T,Y=o.y*T,w=o.w*T,h=o.h*T;
  tx.fillStyle='rgba(0,0,0,.35)';tx.fillRect(X+1,Y+h-2,w-1,3);
  const box=(x,y,ww,hh,c,top)=>{px(tx,x,y,ww,hh,'#140a1c');px(tx,x+1,y+1,ww-2,hh-2,c);if(top)px(tx,x+1,y+1,ww-2,2,top);};
  switch(o.kind){
  case'V':box(X+1,Y+3,w-2,11,'#6a4a20');px(tx,X+2,Y+4,w-4,6,'#7ff6ff');px(tx,X+3,Y+5,w-6,4,'#c6fbff');for(let i=0;i<6;i++)px(tx,X+4+i*4,Y+6,2,2,i%2?'#ffd34d':'#fff');break;
  case'S':box(X,Y+1,w,13,'#5a3a22');for(let i=0;i<3;i++){px(tx,X+1,Y+5+i*3,w-2,1,'#2c1b10');px(tx,X+3+i*9,Y+3,5,2,['#a33','#36c','#c9a24a'][i]);px(tx,X+6+i*8,Y+9,4,3,['#c9a24a','#7c4','#a33'][i]);}break;
  case'C':box(X+2,Y+3,12,11,'#8a5a2a','#b07a3a');px(tx,X+3,Y+8,10,1,'#5a3a1a');px(tx,X+7,Y+4,1,9,'#5a3a1a');break;
  case'D':box(X,Y+4,w,10,'#4a2a18','#6a3a20');px(tx,X+6,Y+6,7,3,'#eee');px(tx,X+22,Y+5,3,4,'#3c8');px(tx,X+16,Y+7,4,2,'#222');break;

// Sprites: pix.js

// ================= Hilfsfunktionen =================
function blockedPx(x,y){return isSolid(Math.floor(x/T),Math.floor(y/T));}
function moveBody(o,dx,dy,r){let moved=false;
  if(!blockedPx(o.x+dx+Math.sign(dx)*r,o.y-2)&&!blockedPx(o.x+dx+Math.sign(dx)*r,o.y+3)){o.x+=dx;moved=moved||dx!==0;}
  if(!blockedPx(o.x-r,o.y+dy+Math.sign(dy)*4)&&!blockedPx(o.x+r,o.y+dy+Math.sign(dy)*4)){o.y+=dy;moved=moved||dy!==0;}return moved;}
function smokeAt(x,y){return smokes.some(s=>Math.hypot(s.x-x,s.y-y)<s.r);}
function los(ax,ay,bx,by){const d=Math.hypot(bx-ax,by-ay),n=Math.ceil(d/4);for(let i=1;i<n;i++){const t=i/n,x=ax+(bx-ax)*t,y=ay+(by-ay)*t;if(blockedPx(x,y)||smokeAt(x,y))return false;}return true;}
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),1600);}
function noise(r){rings.push({x:P.x,y:P.y,r:0,max:r});guards.forEach(g=>{if(g.down||g.stun>0)return;if(Math.hypot(g.x-P.x,g.y-P.y)<r&&g.mode==='patrol'){g.mode='check';g.tx=P.x;g.ty=P.y;g.look=0;}});}
function copTime(){return Math.max(30,60-(CFG.heat||0)*6);}
function raise(v){alarm=Math.min(100,Math.max(alarm,v));if(alarm>=100&&!cop){cop=performance.now()+copTime()*1000;toast('ALARM! POLIZEI KOMMT');SFX('siren');MOOD('alarm');}}
const ptile=()=>[Math.floor(P.x/T),Math.floor(P.y/T)];
function rectDist(o){const x0=o.x*T,y0=o.y*T,x1=x0+o.w*T,y1=y0+o.h*T;const qx=Math.max(x0,Math.min(P.x,x1)),qy=Math.max(y0,Math.min(P.y-4,y1));return Math.hypot(qx-P.x,qy-(P.y-4));}
function nearThing(){
  const[px0,py0]=ptile();let best=null,bd=99;
  for(let y=py0-2;y<=py0+2;y++)for(let x=px0-3;x<=px0+3;x++){if(!G[y]||x<0||x>=W)continue;const k=x+','+y,c=G[y][x];let o=null,d=99;
    const tileD=()=>rectDist({x,y,w:1,h:1});
    if(CT[y][x]&&CT[y][x].cont){o={k:'cont',o:CT[y][x],c:CT[y][x].cont};d=rectDist(CT[y][x]);}
    else if(DOORS[k]&&!DOORS[k].open){o={k:'door',d:DOORS[k]};d=tileD();}
    else if(c==='F'&&lasersOn){o={k:'fuse'};d=tileD();}
    else if(c==='M'&&camsOn){o={k:'mon'};d=tileD();}
    else if(c==='P'&&alarmPanel&&!disarmed){o={k:'panel'};d=tileD();}
    if(o&&d<13&&d<bd){bd=d;best=o;}}
  return best;}
function onExit(){const c=at(...ptile());return EXITS.includes(c)?c:null;}
function nearGuard(){let best=null;guards.forEach(g=>{if(g.down)return;const d=Math.hypot(g.x-P.x,g.y-P.y);if(d<20&&(!best||d<best.d))best={g,d};});return best;}
const angDiff=(a,b)=>{let d=a-b;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d;};

// ================= Hauptlogik =================
function upd(dt){
  if(state==='end'||state==='load'||state==='intro')return;
  const frozen=state!=='play';
  let mx=jx,my=jy;if(!frozen){if(key.a||key.arrowleft)mx=-1;if(key.d||key.arrowright)mx=1;if(key.w||key.arrowup)my=-1;if(key.s||key.arrowdown)my=1;}
  if(frozen||busy){mx=my=0;}
  const ml=Math.hypot(mx,my);if(ml>1){mx/=ml;my/=ml;}
  if(busy){busy.t+=dt;$('pbar').style.width=Math.min(100,busy.t/busy.dur*100)+'%';
    if(busy.pulse&&busy.t>=busy.nextP){busy.nextP+=busy.pulse;noise(busy.pr);SFX(busy.snd||'drill');}
    if(busy.t>=busy.dur){const b=busy;busy=null;$('prog').style.display='none';b.done();}}
  if(P.swing>0)P.swing=Math.max(0,P.swing-dt);
  const run=ml>.6,sp=48*(run?1:.5);P.moving=ml>.05;
  if(ml>.05){moveBody(P,mx*sp*dt,my*sp*dt,4);P.face=Math.atan2(my,mx);P.step+=dt*8;if(run&&Math.random()<dt*1.1)noise(55);
    if(lasersActive()&&at(...ptile())==='B')tripLaser();}
  // Alarmanlage
  if(armed&&!disarmed){const[,ty]=ptile();if(!alarmT&&ty<yardTop-1&&ty>0){alarmT=18;toast('ALARMANLAGE PIEPT!');SFX('beep');}
    if(alarmT>0&&!jammed()){const ob=Math.ceil(alarmT);alarmT-=dt;if(Math.ceil(alarmT)!==ob)SFX('beep');if(alarmT<=0){alarmT=-1;disarmed=true;raise(100);toast('ALARMANLAGE LÖST AUS!');}}}
  // Wachen
  guards.forEach(g=>{
    if(g.down){g.moving=false;return;}
    if(g.stun>0){g.stun-=dt;g.moving=false;g.sus=0;if(g.stun<=0){g.mode='check';g.tx=P.x;g.ty=P.y;g.look=0;}return;}
    let tx_,ty_,spd=26;
    if(g.mode==='chase'){tx_=P.x;ty_=P.y;spd=50;if(!los(g.x,g.y-6,P.x,P.y-6)){g.lost=(g.lost||0)+dt;if(g.lost>3){g.mode='check';g.tx=P.x;g.ty=P.y;g.look=0;g.lost=0;}}else g.lost=0;}
    else if(g.mode==='check'){tx_=g.tx;ty_=g.ty;spd=34;if(Math.hypot(tx_-g.x,ty_-g.y)<8||g.stuck>1.2){g.look+=dt;g.dir+=dt*2.4;if(g.look>3){g.mode='patrol';g.stuck=0;}tx_=g.x;ty_=g.y;}}
    else{const w=g.path[g.wp];tx_=w[0]*T;ty_=w[1]*T;if(Math.hypot(tx_-g.x,ty_-g.y)<3){g.wp=(g.wp+1)%g.path.length;g.stuck=0;}}
    const dxg=tx_-g.x,dyg=ty_-g.y,d=Math.hypot(dxg,dyg);g.moving=d>1;
    if(d>1){const a=Math.atan2(dyg,dxg);g.dir+=angDiff(a,g.dir)*Math.min(1,dt*6);
      const mv=moveBody(g,Math.cos(g.dir)*spd*dt,Math.sin(g.dir)*spd*dt,4);
      if(!mv){g.stuck+=dt;if(g.mode==='patrol'&&g.stuck>1){g.wp=(g.wp+1)%g.path.length;g.stuck=0;}}
      g.step+=dt*6;}
    const vx=P.x-g.x,vy=P.y-g.y,vd=Math.hypot(vx,vy),ang=angDiff(Math.atan2(vy,vx),g.dir);
    const range=g.mode==='chase'?150:88;
    if(vd<range&&Math.abs(ang)<.55&&los(g.x,g.y-6,P.x,P.y-6)){g.sus=Math.min(100,g.sus+dt*((busy||state!=='play')?150:95)*(1.45-vd/range));if(g.mode==='patrol'&&g.sus>35){g.mode='check';g.tx=P.x;g.ty=P.y;g.look=0;}}
    else g.sus=Math.max(0,g.sus-dt*12);
    if(g.sus>=100&&g.mode!=='chase'){g.mode='chase';raise(100);toast('ENTDECKT!');SFX('alert');}
    if(g.mode==='chase'&&vd<10){if(!g.hitCd||g.hitCd<performance.now()){g.hitCd=performance.now()+700;SFX('hit');}P.hp-=dt*25;if(P.hp<=0)busted('Der Wachmann ringt dich zu Boden. Handschellen klicken.');}
  });
  // Kameras
  cams.forEach(c=>{c.dir=c.base+Math.sin(performance.now()/1400+c.sw)*.8;if(!camsActive()){c.sus=0;return;}
    const vx=P.x-c.x,vy=P.y-c.y,vd=Math.hypot(vx,vy),ang=angDiff(Math.atan2(vy,vx),c.dir);
    if(vd<96&&Math.abs(ang)<.42&&los(c.x,c.y,P.x,P.y-6)){c.sus=Math.min(100,c.sus+dt*70);if(c.sus>=100){raise(100);guards.forEach(g=>{if(!g.down&&g.mode!=='chase'){g.mode='check';g.tx=P.x;g.ty=P.y;g.look=0;}});}}
    else c.sus=Math.max(0,c.sus-dt*20);});
  const s=Math.max(0,...guards.map(g=>g.down?0:g.sus),...cams.map(c=>c.sus));if(s*.7>alarm)alarm=Math.min(99,s*.7);
  const cp=$('cop');
  if(cop){const l=Math.ceil((cop-performance.now())/1000);cp.className='';cp.style.display='block';cp.textContent='POLIZEI IN '+Math.max(0,l)+' s';if(l<=0)busted('Blaulicht überall. Das Gebäude ist umstellt.');}
  else if(alarmT>0&&!disarmed){cp.className='warn';cp.style.display='block';cp.textContent=(jammed()?'ALARM GESTÖRT ':'ALARMANLAGE ')+Math.ceil(alarmT)+' s';}
  else cp.style.display='none';
  rings.forEach(n=>n.r+=dt*120);rings=rings.filter(n=>n.r<n.max);
  smokes.forEach(s=>{s.t-=dt;s.r=Math.min(46,s.r+dt*40);});smokes=smokes.filter(s=>s.t>0);
  flashes.forEach(f=>f.t-=dt);flashes=flashes.filter(f=>f.t>0);
  updButtons();
  $('hp').textContent=Math.max(0,Math.round(P.hp));$('bv').textContent='$'+bagVal();$('al').style.width=Math.min(100,alarm)+'%';
  $('iJam').classList.toggle('on',jammed());
}
let lastBtn='';
function updButtons(){
  const a=$('act'),k=$('atk');let label='—',on=false;
  if(state==='play'&&!busy){const ex=onExit(),th=nearThing();
    if(ex){label='ABHAUEN';on=true;}
    else if(th){on=true;label=th.k==='cont'?(th.c.done?'ÖFFNEN':'DURCH-<br>SUCHEN'):th.k==='door'?(th.d.type==='W'?'FENSTER':'TÜR'):th.k==='fuse'?'STROM-<br>KASTEN':th.k==='mon'?'MONITOR':'ALARM-<br>ANLAGE';}}
  const ng=state==='play'&&!busy&&nearGuard();
  const key_=label+on+!!ng+qKey()+LO.weapon;
  if(key_===lastBtn)return;lastBtn=key_;
  a.innerHTML=label;a.classList.toggle('on',on);k.classList.toggle('off',!ng);
  k.innerHTML=LO.weapon?`<img src="it_${LO.weapon}.webp" alt=""><small>${LO.weapon==='revolver'?'SCHUSS':'SCHLAG'}</small>`:'<small>FAUST</small>';
  ['q1','q2'].forEach(q=>{const id=LO[q]||lastQ[q];const n=id?countOf(id):0;const b=$(q);
    if(id){b.innerHTML=`<img src="it_${id}.webp" alt=""><small>×${n}</small>`;b.classList.toggle('off',!n);}else{b.innerHTML='<small>leer</small>';b.classList.add('off');}});
}
const lastQ={q1:null,q2:null};
function countOf(id){return Object.entries(LO).filter(([k,v])=>v===id&&(k==='q1'||k==='q2'||k==='safe')).length+BAG.filter(p=>p.id===id).length;}
function qKey(){return['q1','q2'].map(q=>{const id=LO[q]||lastQ[q];return id+(id?countOf(id):0);}).join();}
function tripLaser(){if(tripLaser.cd&&performance.now()<tripLaser.cd)return;tripLaser.cd=performance.now()+2500;SFX('laser');toast('LASER! STILLER ALARM');raise(Math.max(alarm+45,60));
  guards.forEach(g=>{if(!g.down&&g.mode==='patrol'){g.mode='check';g.tx=P.x;g.ty=P.y;g.look=0;}});}

// ================= Benutzen =================
function consume(id){
  for(const k of['q1','q2','safe'])if(LO[k]===id){LO[k]=null;return true;}
  const p=BAG.find(p=>p.id===id);if(p){BAG.splice(BAG.indexOf(p),1);return true;}return false;}
function useItem(id){
  if(id==='medkit'&&P.hp>=100){toast('DU BIST FIT');return false;}
  if(!consume(id))return false;
  if(id==='medkit'){SFX('heal');P.hp=Math.min(100,P.hp+50);toast('+50 GESUNDHEIT');}
  if(id==='rauch'){SFX('smoke');smokes.push({x:P.x,y:P.y-4,r:6,t:8});guards.forEach(g=>{if(g.mode==='chase'){g.mode='check';g.tx=P.x;g.ty=P.y;g.look=0;g.sus=40;}});toast('RAUCH!');noise(40);}
  if(id==='blend'){SFX('flash');flashes.push({x:P.x+Math.cos(P.face)*24,y:P.y+Math.sin(P.face)*24,t:.5});let n=0;
    guards.forEach(g=>{if(g.down)return;const fx=P.x+Math.cos(P.face)*24,fy=P.y+Math.sin(P.face)*24;if(Math.hypot(g.x-fx,g.y-fy)<85&&los(fx,fy-4,g.x,g.y-6)){g.stun=6;g.mode='stun';n++;}});
    noise(150);toast(n?`${n} GEBLENDET!`:'DANEBEN!');}
  if(id==='stoer'){SFX('jam');jamUntil=performance.now()+25000;toast('STÖRSENDER: 25 s');}
  lastBtn='';return true;
}
function useQ(q){if(state!=='play')return;const id=LO[q]||lastQ[q];if(!id)return;if(!countOf(id)){toast('AUFGEBRAUCHT');return;}useItem(id);}

// ================= Aktionen =================
function startBusy(label,dur,done,pulse,pr,snd){busy={t:0,dur,done,pulse,pr,snd,nextP:pulse||0};SFX(snd||'loot');$('progt').textContent=label;$('pbar').style.width='0';$('prog').style.display='block';}
function doAct(){
  if(state!=='play'||busy)return;
  const ex=onExit();if(ex){extract(ex);return;}
  const th=nearThing();if(!th)return;
  if(th.k==='cont'){const C=th.c;if(C.done){openLoot(C);return;}
    if(C.type==='X'){safeMenu(C);return;}
    const D=CDEF[C.type];noise(D.nz*4);startBusy(C.type==='A'?'AUSSCHLACHTEN …':'DURCHSUCHEN …',D.t,()=>{C.done=true;SFX('loot');if(C.note&&!codeKnown){codeKnown=true;$('iCode').textContent='SAFE-CODE: '+CODE;$('iCode').classList.add('on');toast('ZETTEL: SAFE-CODE '+CODE);}openLoot(C);},C.type==='A'?1:0,60);return;}
  if(th.k==='door'){doorMenu(th.d);return;}
  if(th.k==='fuse'){wireGame('STROMKASTEN','Gleiche Farben verbinden – dann sind die Laser aus.',()=>{lasersOn=false;$('iLaser').classList.add('on');toast('LASER AUS!');SFX('zip');});return;}

    if(e.g&&e.o.down){px(cx,e.o.x-8,e.o.y-3,16,6,'#24407e');px(cx,e.o.x+5,e.o.y-4,5,5,'#d9a07a');px(cx,e.o.x+6,e.o.y-5,4,2,'#1c2a5a');cx.fillStyle='#ffe14d';cx.font='bold 7px monospace';cx.fillText('zZ',e.o.x+6,e.o.y-8);return;}
    if(e.g)drawMan(cx,e.o.x,e.o.y,e.o.dir,e.o.step,1,e.o.moving);else drawHero(cx,P.x,P.y,P.face,P.step,P.moving,{weapon:LO.weapon,bag:1,swing:P.swing||0});
    if(e.g&&e.o.stun>0){for(let i=0;i<3;i++){const a=t/200+i*2.1;px(cx,e.o.x+Math.cos(a)*6-1,e.o.y-20+Math.sin(a)*2,2,2,'#ffe14d');}}});
  guards.forEach(g=>{if(g.down||g.stun>0)return;if(g.sus>5){px(cx,g.x-6,g.y-23,12,3,'#000');px(cx,g.x-5,g.y-22,Math.round(10*g.sus/100),1,g.sus>70?'#ff3d3d':'#ffe14d');}
    cx.font='bold 10px monospace';if(g.mode==='check'){cx.fillStyle='#ffe14d';cx.fillText('?',g.x-2,g.y-25);}if(g.mode==='chase'){cx.fillStyle='#ff3d3d';cx.fillText('!',g.x-2,g.y-25);}});
  smokes.forEach(s=>{for(let i=0;i<14;i++){const a=i*2.4+t/900,r=s.r*(.3+.7*((i*37)%10)/10);cx.fillStyle=`rgba(200,210,230,${Math.min(.75,s.t/3)})`;cx.beginPath();cx.arc(s.x+Math.cos(a)*r,s.y+Math.sin(a)*r*.7,10,0,7);cx.fill();}});
  cx.restore();
  dx.globalCompositeOperation='source-over';dx.fillStyle=cop?`rgba(${40+30*Math.sin(t/150)},2,${30+30*Math.cos(t/150)},.5)`:'rgba(8,2,20,.26)';dx.fillRect(0,0,VW,VH);
  dx.globalCompositeOperation='destination-out';
  const light=(x,y,r)=>{const g=dx.createRadialGradient(x-camx,y-camy,0,x-camx,y-camy,r);g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(1,'rgba(0,0,0,0)');dx.fillStyle=g;dx.beginPath();dx.arc(x-camx,y-camy,r,0,7);dx.fill();};
  light(P.x,P.y-6,80);guards.forEach(g=>{if(!g.down&&g.stun<=0)light(g.x+Math.cos(g.dir)*32,g.y+Math.sin(g.dir)*32,38);});
  LIGHTS.forEach(([x,y],i)=>light(x*T,y*T,36+Math.sin(t/400+i)*3));
  dx.globalCompositeOperation='source-over';cx.drawImage(dark,0,0);
  flashes.forEach(f=>{cx.fillStyle=`rgba(255,255,240,${Math.min(1,f.t*2)})`;cx.fillRect(0,0,VW,VH);});
}

// ================= Ende =================
function wipe(cb){const w=$('wipe');w.classList.remove('go');void w.offsetWidth;w.classList.add('go');setTimeout(cb,500);}
function resultPanel(html){$('ov').className='ov mid on';$('ov').innerHTML=`<div class="lp">${html}</div>`;}
function leaveFS(){try{if(screen.orientation&&screen.orientation.unlock)screen.orientation.unlock();if(document.fullscreenElement)document.exitFullscreen();}catch(e){}}
function sendEnd(res){
  leaveFS();
  const lo=Object.assign({},LO);
  const data={type:'heistEnd',res,kind:CFG.kind,btype:CFG.type,bag:BAG.map(p=>p.id).filter(id=>id!=='karte'),lo,heat,alarm:Math.round(alarm),val:bagVal()};
  if(EMBED)window.parent.postMessage(data,'*');else location.reload();
}
function extract(kind){
  state='end';heat=(alarm>=60?1:0)+(kind==='O'?2:0)+(cop?1:0);const v=bagVal();lastBtn='';updButtons();
  const items=BAG.filter(p=>p.id!=='karte');const mats=items.filter(p=>IT[p.id].mat).length,plans=items.filter(p=>IT[p.id].plan).length;
  wipe(()=>resultPanel(`<div class="big">ENTKOMMEN!</div><p>${kind==='O'?'Du stürmst durch die Vordertür auf die Hauptstraße und tauchst in der Menge unter.':'Du springst in den Wagen. Reifen quietschen, die Neonlichter verschwimmen.'}</p>
    <div class="rw"><span>${items.length} Teile · $${v}</span>${mats?`<span>${mats}× Material</span>`:''}${plans?`<span>${plans}× Bauplan</span>`:''}${heat?`<span class="h">+${heat} Heat</span>`:''}</div>
    <div class="bt"><button type="button" class="p" id="fin">${EMBED?'ZURÜCK INS VERSTECK':'NOCHMAL'}</button></div>`));
  setTimeout(()=>{const b=$('fin');if(b)b.onclick=()=>sendEnd('escape');},600);
}
function busted(txt){
  if(state==='end')return;state='end';busy=null;$('prog').style.display='none';heat=2;lastBtn='';
  wipe(()=>resultPanel(`<div class="big bad">ERWISCHT!</div><p>${txt}</p><div class="rw"><span class="h">Beute ($${bagVal()}) weg</span><span class="h">Ausrüstung weg${LO.safe?' (außer Geheimfach)':''}</span><span class="h">+2 Heat</span></div>
    <div class="bt"><button type="button" class="p" id="fin">${EMBED?'ZURÜCK INS VERSTECK':'NOCHMAL'}</button></div>`));
  setTimeout(()=>{const b=$('fin');if(b)b.onclick=()=>sendEnd('busted');},600);
}
const INTRO={
  golden:['GOLDEN PALM','01:12 Uhr. Der größte Juwelier der Innenstadt: Lager, Büro, Security-Raum, Verkaufsraum mit Lasern – und ganz hinten der <b>Tresor</b>.','Im Lager liegt der Safe-Code. Der Stromkasten im Flur schaltet die Laser ab. Die Key-Card für den Tresor ist im Büro-Schreibtisch. Ausgänge: Fluchtwagen (grün) oder Vordertür (+2 Heat).'],
  werkstatt:['AUTOWERKSTATT','Nachts nur ein Wächter. In Werkzeugschränken, Kisten und den Autos stecken <b>Metall, Kabel, Klebeband</b> – und in Autoradios <b>Platinen</b>.','Autos ausschlachten dauert und klappert. Bauplan? Schau in Schreibtisch und Safe.'],
  apotheke:['APOTHEKE','Hinter der Theke lagern <b>Medikamente</b>, im Labor <b>Chemikalien</b>. Am Eingang hängt eine <b>Alarmanlage</b> – nach dem Betreten hast du 18 Sekunden.','Alarmanlage: Kabel-Rätsel am Kasten neben der Tür. Mit Störsender gewinnst du Zeit.'],
  villa:['VILLA','Reiche Leute, teure Sachen: <b>Schmuck, Gold, Platinen</b> aus der Haustechnik. Aber: Security, Kameras, eine <b>Laserschranke</b> und eine Alarmanlage.','Stromkasten suchen = Laser aus. Security-Monitor = Kameras aus. Fenster sind ein leiser Weg rein – mit Dietrich.']
};
function intro(){
  state='intro';checkRot();
  const I=INTRO[CFG.kind==='golden'?'golden':CFG.type];
  const tl=[LO.tool1,LO.tool2].filter(Boolean).map(i=>IT[i].n).join(', ')||'kein Werkzeug';
  resultPanel(`<div class="big" style="font-size:34px">${CFG.name||I[0]}</div><p>${I[1]}</p>
  <p style="font-size:13px;color:#cbbbe6">🕹️ Linke Hand: ziehen = laufen (wenig = schleichen). Rechte Hand: 🟡 Aktion · 🔴 Schlag (von hinten!) · Schnellslots · 🎒 Tasche.<br>Tipp: ${I[2]}</p>
  <p style="font-size:13px;color:#7ff6ff">Dabei: ${tl}${LO.weapon?' · '+IT[LO.weapon].n:''}</p>
  <div class="bt"><button type="button" class="p" id="go">LOS GEHT’S</button></div>`);
  $('go').onclick=async()=>{try{if(document.documentElement.requestFullscreen&&innerHeight>innerWidth){await document.documentElement.requestFullscreen();if(screen.orientation&&screen.orientation.lock)await screen.orientation.lock('landscape');}}catch(e){}
    closeOv();state='play';checkRot();MOOD('action');if(!EMBED&&window.NHA)NHA.start();};
}
function begin(cfg){
  CFG=Object.assign(CFG,cfg||{});seed=(CFG.seed||Date.now())|0;
  BW=CFG.bagW||5;BH=CFG.bagH||4;
  ['q1','q2'].forEach(q=>lastQ[q]=LO[q]);
  CODE=String(1000+Math.floor(rnd()*9000));
  if(CFG.kind==='golden')buildGolden();else buildGen(CFG);
  setupDoors();drawTiles();
  $('title').textContent=(CFG.name||'EINSATZ').toUpperCase();
  lastBtn='';updButtons();intro();
}
addEventListener('message',e=>{const d=e.data||{};if(d.type==='heistStart'){LO=Object.assign({weapon:null,tool1:null,tool2:null,q1:null,q2:null,safe:null},d.lo||{});begin(d.cfg);}});
if(location.hash==='#dbg')window._h={P,get guards(){return guards},get conts(){return OBJ.filter(o=>o.cont)},get DOORS(){return DOORS},get G(){return G},doAct,useItem,get st(){return state},bag:()=>BAG,lo:()=>LO,flags:()=>({lasersOn,camsOn,codeKnown,alarm,armed,disarmed,alarmT,W,H,yardTop}),begin,get tiles(){return tiles}};
if(!EMBED){const q=new URLSearchParams(location.search);begin({kind:q.get('k')||'gen',type:q.get('t')||'villa',diff:+(q.get('d')||2),seed:+(q.get('s')||Date.now()%1e6),name:q.get('k')==='golden'?'Golden Palm':'Testeinbruch'});}
else window.parent.postMessage({type:'heistReady'},'*');
resize();
let last=performance.now();
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;upd(dt);draw(t);requestAnimationFrame(loop);}
requestAnimationFrame(loop);
})();
</script>
